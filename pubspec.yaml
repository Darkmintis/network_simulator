name: network_simulator
description: A Flutter debug tool that simulates real-world network conditions via a local VPN tunnel on Android and iOS (latency, jitter, bandwidth, packet loss, offline).
version: 0.1.0
homepage: https://github.com/Darkmintis/network_simulator
repository: https://github.com/Darkmintis/network_simulator
issue_tracker: https://github.com/Darkmintis/network_simulator/issues
topics:
  - network
  - testing
  - debug
  - vpn
  - devtools

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

example: example

flutter:
  plugin:
    platforms:
      android:
        package: com.darkmintis.network_simulator
        pluginClass: NetworkSimulatorPlugin
      ios:
        pluginClass: NetworkSimulatorPlugin
      linux:
        dartPluginClass: NetworkSimulatorPluginLinux
      macos:
        dartPluginClass: NetworkSimulatorPluginMacOS
      windows:
        dartPluginClass: NetworkSimulatorPluginWindows
      web:
        pluginClass: NetworkSimulatorPluginWeb
        fileName: network_simulator_web.dart
